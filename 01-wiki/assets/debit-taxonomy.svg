<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <!-- card background: keeps the diagram legible on light OR dark note backgrounds -->
  <rect x="6" y="6" width="1228" height="888" rx="18" fill="#ffffff" stroke="#d7dde3" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0561f"/>
    </marker>
  </defs>

  <!-- ===== header ===== -->
  <text x="44" y="58" font-size="30" font-weight="700" fill="#1e2a36">The Debit Taxonomy</text>
  <text x="44" y="86" font-size="15" fill="#5b6b7a">Foundations §3.2 — what kind of debit a thing carries, and how each kind behaves when the thing changes hands.</text>

  <!-- ===== root ===== -->
  <rect x="510" y="112" width="220" height="66" rx="12" fill="#eef2f6" stroke="#34495e" stroke-width="2"/>
  <text x="620" y="145" font-size="21" font-weight="700" fill="#1e2a36" text-anchor="middle">DEBIT</text>
  <text x="620" y="167" font-size="13" fill="#5b6b7a" text-anchor="middle">a vector, not one number (§3.2a)</text>

  <text x="620" y="200" font-size="12.5" fill="#7b8894" text-anchor="middle">Held as physical quantities — kg · joules · labour-hours · m³ water · land·years — collapsed to a single figure only on demand.</text>
  <text x="620" y="218" font-size="12.5" font-weight="600" fill="#8a5a1f" text-anchor="middle">Every division happens per-dimension, BEFORE collapsing — or the weighting model silently controls every split.</text>

  <!-- connectors root -> branches -->
  <path d="M620 240 L620 262 L370 262 L370 292" fill="none" stroke="#9aa7b3" stroke-width="2"/>
  <path d="M620 240 L620 262 L965 262 L965 292" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <!-- ===== LEFT branch: PROPERTY ===== -->
  <rect x="40" y="292" width="660" height="60" rx="12" fill="#e7f0fa" stroke="#2c6fb3" stroke-width="2"/>
  <text x="370" y="320" font-size="19" font-weight="700" fill="#1b4f86" text-anchor="middle">PROPERTY DEBIT</text>
  <text x="370" y="341" font-size="13" fill="#42607d" text-anchor="middle">a current-holdings term · attaches to the object · has three components</text>

  <!-- connectors property -> three components -->
  <path d="M370 352 L370 372 L140 372 L140 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>
  <path d="M370 352 L370 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>
  <path d="M370 352 L370 372 L590 372 L590 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <!-- component 1: embodied material (dischargeable) -->
  <rect x="40" y="392" width="200" height="206" rx="12" fill="#ffffff" stroke="#1f9d55" stroke-width="2"/>
  <text x="140" y="420" font-size="16" font-weight="700" fill="#146c3a" text-anchor="middle">Embodied material</text>
  <text x="140" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">the atoms you are holding</text>
  <rect x="54" y="456" width="172" height="26" rx="6" fill="#e6f6ee"/>
  <text x="140" y="474" font-size="13" font-weight="700" fill="#1f9d55" text-anchor="middle">DISCHARGEABLE</text>
  <text x="140" y="503" font-size="12" fill="#3d4b58" text-anchor="middle">Transfers with the object —</text>
  <text x="140" y="519" font-size="12" fill="#3d4b58" text-anchor="middle">rides the atoms to the new</text>
  <text x="140" y="535" font-size="12" fill="#3d4b58" text-anchor="middle">holder, and you are clear</text>
  <text x="140" y="551" font-size="12" fill="#3d4b58" text-anchor="middle">of it entirely.</text>
  <text x="140" y="574" font-size="11" fill="#94a1ad" text-anchor="middle">→ used goods enter cheap</text>

  <!-- component 2: creation-cost / labour (permanent per holder) -->
  <rect x="254" y="392" width="224" height="206" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="366" y="420" font-size="16" font-weight="700" fill="#93261a" text-anchor="middle">Creation-cost / labour</text>
  <text x="366" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">the hours that made it</text>
  <rect x="268" y="456" width="196" height="26" rx="6" fill="#fbe9e7"/>
  <text x="366" y="474" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">PERMANENT per holder</text>
  <text x="366" y="503" font-size="12" fill="#3d4b58" text-anchor="middle">Holding-time split: your share</text>
  <text x="366" y="519" font-size="12" fill="#3d4b58" text-anchor="middle">= your time ÷ the asset's life.</text>
  <text x="366" y="535" font-size="12" fill="#3d4b58" text-anchor="middle">Dilutes as others hold it, and</text>
  <text x="366" y="551" font-size="12" fill="#3d4b58" text-anchor="middle">never zeroes. Clock starts at</text>
  <text x="366" y="567" font-size="12" fill="#3d4b58" text-anchor="middle">deployment; transit carriers</text>
  <text x="366" y="583" font-size="12" fill="#3d4b58" text-anchor="middle">accrue none. (§4.5)</text>

  <!-- component 3: latent pollution (rides the object, locks on use) -->
  <rect x="492" y="392" width="196" height="206" rx="12" fill="#ffffff" stroke="#d18b2c" stroke-width="2"/>
  <text x="590" y="420" font-size="16" font-weight="700" fill="#8a5a1f" text-anchor="middle">Latent pollution</text>
  <text x="590" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">what it will emit when used</text>
  <rect x="502" y="456" width="176" height="26" rx="6" fill="#fdf1dd"/>
  <text x="590" y="474" font-size="13" font-weight="700" fill="#b0561f" text-anchor="middle">RIDES THE OBJECT</text>
  <text x="590" y="503" font-size="12" fill="#3d4b58" text-anchor="middle">Nobody has caused an</text>
  <text x="590" y="519" font-size="12" fill="#3d4b58" text-anchor="middle">emission yet, so it moves</text>
  <text x="590" y="535" font-size="12" fill="#3d4b58" text-anchor="middle">with the thing. Recorded</text>
  <text x="590" y="551" font-size="12" fill="#3d4b58" text-anchor="middle">at the hand-off, in litres</text>
  <text x="590" y="567" font-size="12" fill="#3d4b58" text-anchor="middle">or kg — never in hours.</text>
  <text x="590" y="585" font-size="11" fill="#94a1ad" text-anchor="middle">→ 40 L petrol stays 40 L</text>

  <!-- ===== RIGHT branch: CONSUMPTION ===== -->
  <rect x="730" y="292" width="470" height="60" rx="12" fill="#fdece3" stroke="#b0561f" stroke-width="2"/>
  <text x="965" y="318" font-size="18" font-weight="700" fill="#8a4014" text-anchor="middle">CONSUMPTION / POLLUTION DEBIT</text>
  <text x="965" y="340" font-size="13" fill="#7a4f31" text-anchor="middle">a permanent-history term · attaches to the causer, not the object</text>

  <path d="M965 352 L965 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <rect x="730" y="392" width="470" height="206" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="965" y="420" font-size="15" font-weight="700" fill="#93261a" text-anchor="middle">Consumption · pollution · transport &amp; energy</text>
  <text x="965" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">what you used up, emitted, or burned to move things</text>
  <rect x="805" y="456" width="320" height="26" rx="6" fill="#fbe9e7"/>
  <text x="965" y="474" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">NEVER discharged — stays on whoever caused it</text>
  <text x="965" y="503" font-size="12.5" fill="#3d4b58" text-anchor="middle">The farmer keeps the fertiliser runoff; the trucker keeps the fuel;</text>
  <text x="965" y="521" font-size="12.5" fill="#3d4b58" text-anchor="middle">you keep only what you ate. Reselling the object sheds none of it.</text>
  <text x="965" y="545" font-size="12" fill="#3d4b58" text-anchor="middle">The provenance record travels with the product so buyers can still see it —</text>
  <text x="965" y="561" font-size="12" fill="#3d4b58" text-anchor="middle">but the debit is pinned to the causer. Its weight floats with ambient stock (§3.3).</text>
  <text x="965" y="578" font-size="11.5" font-weight="600" fill="#8a4014" text-anchor="middle">Pollution from MAKING stays with the maker.</text>
  <text x="965" y="592" font-size="11.5" font-weight="600" fill="#8a4014" text-anchor="middle">Pollution from USING is the user's. (§3.2b)</text>

  <!-- the conversion arrow: latent -> consumption, on use -->
  <path d="M694 496 L726 496" fill="none" stroke="#b0561f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="710" y="486" font-size="10.5" font-weight="700" fill="#b0561f" text-anchor="middle">on use</text>

  <!-- ===== overlay band: the two cross-cutting rules ===== -->
  <rect x="40" y="628" width="1160" height="128" rx="12" fill="#f4f7fa" stroke="#c7d2dc" stroke-width="1.5"/>
  <text x="60" y="654" font-size="13" font-weight="700" fill="#34495e">TWO RULES THAT CUT ACROSS EVERY BRANCH</text>

  <circle cx="66" cy="682" r="4" fill="#2c6fb3"/>
  <text x="80" y="686" font-size="13" font-weight="700" fill="#1b4f86">Self-work identity.</text>
  <text x="212" y="686" font-size="13" fill="#3d4b58">While you hold a thing, working on it earns credit exactly equal to the property-debit it adds → net zero</text>
  <text x="80" y="705" font-size="13" fill="#3d4b58">(bar materials used up). This is why property is a burden, not an engine — no rent, no appreciation, nothing earned by mere holding.</text>

  <circle cx="66" cy="728" r="4" fill="#c0392b"/>
  <text x="80" y="732" font-size="13" font-weight="700" fill="#93261a">Non-cascade (§3.2b = §4.5 — one rule, both directions).</text>
  <text x="425" y="732" font-size="13" fill="#3d4b58">Cost attaches only to the causer. Never onward to a</text>
  <text x="80" y="751" font-size="13" fill="#3d4b58">buyer (pollution), never backwards to the first human who ever built anything (creation-cost). Either cascade breaks the books.</text>

  <!-- end-of-life note -->
  <rect x="40" y="770" width="1160" height="52" rx="10" fill="#fff6e9" stroke="#e0b877" stroke-width="1.5"/>
  <text x="60" y="794" font-size="13" font-weight="700" fill="#8a5a1f">End of life:</text>
  <text x="152" y="794" font-size="13" fill="#3d4b58">refuse to pass a worn-out thing on and you have consumed it — its property-debit becomes your permanent</text>
  <text x="60" y="812" font-size="13" fill="#3d4b58">consumption debit, as if you had eaten it. A discarded object is itself a pollutant for as long as it sits (§3.6).</text>

  <!-- legend -->
  <rect x="612" y="850" width="14" height="14" rx="3" fill="#e6f6ee" stroke="#1f9d55" stroke-width="1.5"/>
  <text x="632" y="862" font-size="12" fill="#5b6b7a">transfers / discharges</text>
  <rect x="790" y="850" width="14" height="14" rx="3" fill="#fdf1dd" stroke="#d18b2c" stroke-width="1.5"/>
  <text x="810" y="862" font-size="12" fill="#5b6b7a">rides the object until used</text>
  <rect x="990" y="850" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="1010" y="862" font-size="12" fill="#5b6b7a">permanent / stays</text>
</svg>
