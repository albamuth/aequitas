<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <!-- card background: keeps the diagram legible on light OR dark note backgrounds -->
  <rect x="6" y="6" width="1068" height="848" rx="18" fill="#ffffff" stroke="#d7dde3" stroke-width="2"/>

  <!-- ===== header ===== -->
  <text x="44" y="58" font-size="30" font-weight="700" fill="#1e2a36">The Debit Taxonomy</text>
  <text x="44" y="86" font-size="15" fill="#5b6b7a">Foundations §3.2 — what kind of debit a thing carries, and how each kind behaves when the thing changes hands.</text>

  <!-- ===== root ===== -->
  <rect x="430" y="112" width="220" height="66" rx="12" fill="#eef2f6" stroke="#34495e" stroke-width="2"/>
  <text x="540" y="145" font-size="21" font-weight="700" fill="#1e2a36" text-anchor="middle">DEBIT</text>
  <text x="540" y="167" font-size="13" fill="#5b6b7a" text-anchor="middle">a vector, not one number (§3.2a)</text>

  <text x="540" y="200" font-size="12.5" fill="#7b8894" text-anchor="middle">Held as physical quantities — kg · joules · labour-hours · m³ water · land·years — collapsed to a single figure only on demand.</text>
  <text x="540" y="218" font-size="12.5" font-weight="600" fill="#8a5a1f" text-anchor="middle">Every division happens per-dimension, BEFORE collapsing — or the weighting model silently controls every split.</text>

  <!-- connectors root -> branches -->
  <path d="M540 240 L540 262 L245 262 L245 292" fill="none" stroke="#9aa7b3" stroke-width="2"/>
  <path d="M540 240 L540 262 L835 262 L835 292" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <!-- ===== LEFT branch: PROPERTY ===== -->
  <rect x="40" y="292" width="490" height="60" rx="12" fill="#e7f0fa" stroke="#2c6fb3" stroke-width="2"/>
  <text x="285" y="320" font-size="19" font-weight="700" fill="#1b4f86" text-anchor="middle">PROPERTY DEBIT</text>
  <text x="285" y="341" font-size="13" fill="#42607d" text-anchor="middle">a current-holdings term · attaches to the object · has two components</text>

  <!-- connectors property -> two components -->
  <path d="M285 352 L285 372 L150 372 L150 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>
  <path d="M285 352 L285 372 L420 372 L420 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <!-- component: embodied material (dischargeable) -->
  <rect x="40" y="392" width="220" height="184" rx="12" fill="#ffffff" stroke="#1f9d55" stroke-width="2"/>
  <text x="150" y="420" font-size="16" font-weight="700" fill="#146c3a" text-anchor="middle">Embodied material</text>
  <text x="150" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">the atoms you are holding</text>
  <rect x="56" y="456" width="188" height="26" rx="6" fill="#e6f6ee"/>
  <text x="150" y="474" font-size="13" font-weight="700" fill="#1f9d55" text-anchor="middle">DISCHARGEABLE</text>
  <text x="150" y="503" font-size="12" fill="#3d4b58" text-anchor="middle">Transfers with the object —</text>
  <text x="150" y="519" font-size="12" fill="#3d4b58" text-anchor="middle">rides the atoms to the new</text>
  <text x="150" y="535" font-size="12" fill="#3d4b58" text-anchor="middle">holder, and you are clear</text>
  <text x="150" y="551" font-size="12" fill="#3d4b58" text-anchor="middle">of it entirely.</text>
  <text x="150" y="568" font-size="11" fill="#94a1ad" text-anchor="middle">→ used goods enter cheap</text>

  <!-- component: creation-cost / labour (permanent per holder) -->
  <rect x="290" y="392" width="240" height="184" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="420" font-size="16" font-weight="700" fill="#93261a" text-anchor="middle">Creation-cost / labour</text>
  <text x="410" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">the hours that made it</text>
  <rect x="306" y="456" width="208" height="26" rx="6" fill="#fbe9e7"/>
  <text x="410" y="474" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">PERMANENT per holder</text>
  <text x="410" y="503" font-size="12" fill="#3d4b58" text-anchor="middle">Holding-time split: your share =</text>
  <text x="410" y="519" font-size="12" fill="#3d4b58" text-anchor="middle">your time ÷ the asset's life.</text>
  <text x="410" y="535" font-size="12" fill="#3d4b58" text-anchor="middle">Dilutes as others hold it, never</text>
  <text x="410" y="551" font-size="12" fill="#3d4b58" text-anchor="middle">zeroes. Clock starts at deployment;</text>
  <text x="410" y="567" font-size="12" fill="#3d4b58" text-anchor="middle">transit carriers accrue none. (§6.2b)</text>

  <!-- ===== RIGHT branch: CONSUMPTION ===== -->
  <rect x="560" y="292" width="480" height="60" rx="12" fill="#fdece3" stroke="#b0561f" stroke-width="2"/>
  <text x="800" y="320" font-size="19" font-weight="700" fill="#8a4014" text-anchor="middle">CONSUMPTION / POLLUTION DEBIT</text>
  <text x="800" y="341" font-size="13" fill="#7a4f31" text-anchor="middle">a permanent-history term · attaches to the causer, not the object</text>

  <path d="M800 352 L800 392" fill="none" stroke="#9aa7b3" stroke-width="2"/>

  <rect x="560" y="392" width="480" height="184" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="800" y="420" font-size="16" font-weight="700" fill="#93261a" text-anchor="middle">Consumption · pollution · transport &amp; energy</text>
  <text x="800" y="441" font-size="12.5" fill="#5b6b7a" text-anchor="middle">what you used up, emitted, or burned to move things</text>
  <rect x="640" y="456" width="320" height="26" rx="6" fill="#fbe9e7"/>
  <text x="800" y="474" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">NEVER discharged — stays on whoever caused it</text>
  <text x="800" y="503" font-size="12.5" fill="#3d4b58" text-anchor="middle">The farmer keeps the fertiliser runoff; the trucker keeps the fuel;</text>
  <text x="800" y="521" font-size="12.5" fill="#3d4b58" text-anchor="middle">you keep only what you ate. Reselling the object sheds none of it.</text>
  <text x="800" y="546" font-size="12" fill="#3d4b58" text-anchor="middle">The provenance record travels with the product so buyers can still see it —</text>
  <text x="800" y="562" font-size="12" fill="#3d4b58" text-anchor="middle">but the debit is pinned to the causer. Its weight floats with ambient stock (§3.3).</text>

  <!-- ===== overlay band: the two cross-cutting rules ===== -->
  <rect x="40" y="606" width="1000" height="128" rx="12" fill="#f4f7fa" stroke="#c7d2dc" stroke-width="1.5"/>
  <text x="60" y="632" font-size="13" font-weight="700" fill="#34495e">TWO RULES THAT CUT ACROSS BOTH BRANCHES</text>

  <circle cx="66" cy="660" r="4" fill="#2c6fb3"/>
  <text x="80" y="664" font-size="13" font-weight="700" fill="#1b4f86">Self-work identity.</text>
  <text x="212" y="664" font-size="13" fill="#3d4b58">While you hold a thing, working on it earns credit exactly equal to the property-debit it adds → net zero</text>
  <text x="80" y="683" font-size="13" fill="#3d4b58">(bar materials used up). This is why property is a burden, not an engine — no rent, no appreciation, nothing earned by mere holding.</text>

  <circle cx="66" cy="706" r="4" fill="#c0392b"/>
  <text x="80" y="710" font-size="13" font-weight="700" fill="#93261a">Non-cascade (§3.2b = §6.2a — one rule, both directions).</text>
  <text x="420" y="710" font-size="13" fill="#3d4b58">Cost attaches only to the causer. Never downstream to a</text>
  <text x="80" y="729" font-size="13" fill="#3d4b58">buyer (pollution), never upstream to the first human who ever built anything (creation-cost). Either cascade breaks the books.</text>

  <!-- end-of-life note -->
  <rect x="40" y="748" width="1000" height="52" rx="10" fill="#fff6e9" stroke="#e0b877" stroke-width="1.5"/>
  <text x="60" y="772" font-size="13" font-weight="700" fill="#8a5a1f">End of life:</text>
  <text x="152" y="772" font-size="13" fill="#3d4b58">refuse to pass a worn-out thing on and you have consumed it — its property-debit becomes your permanent</text>
  <text x="60" y="790" font-size="13" fill="#3d4b58">consumption debit, as if you had eaten it. A discarded object is itself a pollutant for as long as it sits (§3.6).</text>

  <!-- legend -->
  <rect x="792" y="828" width="14" height="14" rx="3" fill="#e6f6ee" stroke="#1f9d55" stroke-width="1.5"/>
  <text x="812" y="840" font-size="12" fill="#5b6b7a">transfers / discharges</text>
  <rect x="946" y="828" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="966" y="840" font-size="12" fill="#5b6b7a">permanent / stays</text>
</svg>
